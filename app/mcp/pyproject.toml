[project]
name = "kiln-mcp-server"
version = "1.2.1"
description = "The Kiln MCP server: connects agents such as Claude Code and Codex to the Kiln app"
requires-python = ">=3.10"
dependencies = [
    "kiln-ai",
    "kiln-server",
    "fastapi>=0.115.4",
    "starlette>=1.3.1",
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "mcp>=1.30.0,<2",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
kiln-ai = { workspace = true }
kiln-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
requires-python = ">=3.10"
