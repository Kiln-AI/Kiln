name: Build and Test

on:
  push:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build, Typecheck, and Test Python
    # A release's commit was already tested here when it was pushed.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      # Remove this later: needed as server expects this dir to exist
      - name: Mock Studio Web UI
        run: mkdir -p ./app/web_ui/build && echo "test" > ./app/web_ui/build/index.html

      - name: Test All Python
        run: uv run python3 -m pytest --runslow .

      - name: Check Python Types
        run: uv run ty check

      - name: Build Core
        run: uv build
        working-directory: ./libs/core

      - name: Build Server
        run: uv build
        working-directory: ./libs/server

  # The full Python suite on the desktop app's other platforms. Too slow for every push,
  # so it runs on release and when started by hand from the Actions tab.
  test_macos_windows:
    name: Test Python (${{ matrix.os }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: "3.13"

    steps:
      - uses: actions/checkout@v4
        with:
          # No git operations after checkout; keep the token out of git config.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install the project
        run: uv sync --all-extras --dev

      # The server expects the web UI build dir to exist.
      - name: Mock Studio Web UI
        run: mkdir -p ./app/web_ui/build && echo "test" > ./app/web_ui/build/index.html

      - name: Test All Python
        run: uv run python -m pytest --runslow .

  # The web host serves web app routes off the file system, and Windows rejects
  # filenames that our routes allow. Only a real Windows file system catches that,
  # so run the web host tests there. Scoped to one test file to stay quick.
  windows-path-handling-tests:
    name: Windows Path Handling Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # No git operations after checkout; keep the token out of git config.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Test Web Host
        run: uv run python -m pytest app/desktop/studio_server/test_webhost.py
