name: Build and Test

on:
  push:

jobs:
  build:
    name: Build, Typecheck, and Test Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      # libs/core and libs/server track a .python-version of 3.13, which uv would
      # otherwise follow in their build steps. Pin every uv command to this leg's Python.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      # Remove this later: needed as server expects this dir to exist
      - name: Mock Studio Web UI
        run: mkdir -p ./app/web_ui/build && echo "test" > ./app/web_ui/build/index.html

      - name: Test All Python
        run: uv run python3 -m pytest --runslow .

      - name: Check Python Types
        run: uv run ty check

      - name: Build Core
        run: uv build
        working-directory: ./libs/core

      - name: Build Server
        run: uv build
        working-directory: ./libs/server

      - name: Build MCP Server
        run: uv build
        working-directory: ./app/mcp

  # Runs only the tests marked windows_ci on Windows, not the full suite. Most are
  # path, encoding and line-ending tests: separators, drive letters, illegal filename
  # characters, the default text encoding and newline translation differ there.
  windows-ci-tests:
    name: Windows CI Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # No git operations after checkout; keep the token out of git config.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run windows_ci Tests
        run: uv run python -m pytest -m windows_ci --runslow .
